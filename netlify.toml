# Configuración de build para Netlify.
# Las variables secretas (STRAPI_URL, STRAPI_TOKEN) se definen en
# Netlify → Site configuration → Environment variables, nunca aquí.

[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cache largo para assets con hash generados por Astro.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
